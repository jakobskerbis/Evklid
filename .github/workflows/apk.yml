# APK za Android brez gradenj na expo.dev (j 2026-11-04: brezplačni Expo ne gradi več).
# Ročni zagon: GitHub > Actions > »APK za Android« > Run workflow (veja main).
# Naredi isto kot gradnja EAS s profilom "direct": kanal posodobitev "direct", številka različice
# = trenutna na evklid.app + 1, podpis z istim ključem kot prej (sicer ga telefon ne namesti čez staro).
# Ključ je v skrivnostih repozitorija (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  datoteka .jks z expo.dev (Credentials) v base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  podatki s iste strani
# Rezultat: izdaja »apk-<številka>« z datoteko evklid.apk; povezavo do nje skrbnik prilepi v
# Račun > Aplikacija za Android (server/mobile/download.js dovoli github.com). Navodila: docs/mobilna-aplikacija.md
name: APK za Android
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_CHANNEL: direct
      EXPO_NO_TELEMETRY: "1"
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Številka različice (evklid.app + 1)
        id: ver
        run: |
          now=$(curl -fsS https://evklid.app/api/app-links | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).apkVersion?.versionCode||0))')
          echo "code=$((now + 1))" >> "$GITHUB_OUTPUT"
          echo "Nova različica: $((now + 1))"
      # Prstni odtis pred prebuild (kot EAS): enak kot pri objavi posodobitev (.eas/workflows/posodobitev.yml),
      # sicer APK ne dobi posodobitev JavaScripta.
      - name: Prstni odtis
        run: |
          fp=$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
          test -n "$fp"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$fp" >> "$GITHUB_ENV"
          echo "Prstni odtis: $fp"
      - run: npx expo prebuild --platform android --no-install
      - name: Kanal direct in številka različice
        env:
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" android/app/build.gradle
          grep -q "versionCode $CODE" android/app/build.gradle
          m=android/app/src/main/AndroidManifest.xml
          if ! grep -q UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY "$m"; then
            sed -i 's|</application>|<meta-data android:name="expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY" android:value="{\&quot;expo-channel-name\&quot;:\&quot;direct\&quot;}"/></application>|' "$m"
          fi
          grep -n "expo-channel-name\|expo.modules.updates" "$m"
      - name: Gradnja
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Podpis z ključem Evklid
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/evklid.jks"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" sign --ks "$RUNNER_TEMP/evklid.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out evklid.apk android/app/build/outputs/apk/release/app-release.apk
          "$signer" verify --print-certs evklid.apk | head -3
          rm -f "$RUNNER_TEMP/evklid.jks"
      - name: Brez ključa (samo preizkus)
        if: env.HAS_KEY != 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk evklid.apk
          echo "::warning::Ni skrivnosti ANDROID_KEYSTORE_BASE64: APK ni podpisan s ključem Evklid in se ne namesti čez staro aplikacijo."
      - uses: actions/upload-artifact@v5
        with:
          name: evklid-apk-${{ steps.ver.outputs.code }}
          path: mobile/evklid.apk
      - name: Izdaja na GitHubu
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          gh release create "apk-$CODE" evklid.apk --target "$GITHUB_SHA" --title "Evklid APK $CODE" --notes "Gradnja $CODE (kanal direct). Povezavo prilepi v Račun > Aplikacija za Android."
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-$CODE/evklid.apk"
          echo "APK: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
