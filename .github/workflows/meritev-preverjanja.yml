# Dnevna meritev matematičnega preverjanja (PV-05, docs/preverjanje.md): referenčni nabor (test/fixtures/preverjanje,
# N-01) skozi vse tri motorje (sympy, skener, skener-lokalno). Brez modela AI in brez stroška.
# Poročilo po predlogi docs/meritve/README.md: za vsak motor napačno potrjene, zaznane napake, lažni alarmi,
# nepreverjene in pokritost nabora kot k/n z imenovalcem in Wilsonovim 95-% intervalom; »Prej« je zadnja meritev v
# docs/meritve/preverjanje-*.json. Poročilo je v povzetku zagona in v artefaktu »meritev-preverjanja« (90 dni).
# Ob napačno potrjeni trditvi, statusu nad upravičenim, izjemi ali motorju, ki ni tekel (npr. brez SymPy): delovni tok
# je rdeč (GitHub pošlje e-pošto lastniku) in odpre ali dopolni zadevo »Dnevna meritev preverjanja ne gre skozi«; ko je
# spet zelen, jo zapre. Slabša merila kot v zadnji meritvi so opozorila v povzetku. Ročni zagon: Actions > Meritev
# preverjanja > Run workflow. Repozitorij je javen: teče samo na main (urnik ali ročno), brez skrivnosti, akcije pripete.
name: Meritev preverjanja
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meritev-preverjanja
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  meritev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      # Namesti tudi SymPy (postinstall), brez katerega motorja sympy in skener ne tečeta.
      - run: npm ci --omit=dev --no-audit --no-fund
        timeout-minutes: 10
      - name: SymPy nameščen
        run: PYTHONPATH=.pylib python3 -c "import sympy; print('SymPy', sympy.__version__)"
      - name: Meritev
        timeout-minutes: 15
        run: |
          set +e -o pipefail  # izhod skripte zajamemo sami, povzetek se zapiše tudi ob neuspehu
          PREJ=$(ls docs/meritve/preverjanje-*.json 2>/dev/null | sort | tail -n 1)
          ARGS=(--strogo --json meritev-preverjanja.json --porocilo meritev-preverjanja.md)
          [[ -n "$PREJ" ]] && ARGS+=(--prej "$PREJ")
          node --disable-warning=ExperimentalWarning scripts/meri-preverjanje.mjs "${ARGS[@]}" 2>&1 | tee meritev.log
          STATUS=$?
          grep '^POSLABŠANJE ' meritev.log | sed 's/^POSLABŠANJE /::warning::Slabše kot v zadnji meritvi: /' || true
          {
            [[ -n "$PREJ" ]] && echo "Primerjava z: \`$PREJ\`" && echo
            [[ -f meritev-preverjanja.md ]] && cat meritev-preverjanja.md
            grep '^POSLABŠANJE \|^NEUSPEH' meritev.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: meritev-preverjanja
          path: |
            meritev.log
            meritev-preverjanja.json
            meritev-preverjanja.md
          if-no-files-found: ignore
          retention-days: 90

  # Zadeva v GitHubu: ob napaki odpre novo ali doda komentar v odprto; ob uspehu odprto zapre. Samo ta posel sme pisati zadeve.
  zadeva:
    needs: meritev
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IZID: ${{ needs.meritev.result }}
      ZAGON: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NASLOV: "Dnevna meritev preverjanja ne gre skozi"
    steps:
      - name: Odpri, dopolni ali zapri zadevo
        run: |
          st=$(gh issue list --state open --search "\"$NASLOV\" in:title" --json number,title --jq "map(select(.title == env.NASLOV))[0].number // empty")
          if [ "$IZID" = "success" ]; then
            [ -n "$st" ] && gh issue close "$st" --comment "Dnevna meritev preverjanja je spet zelena: $ZAGON"
            exit 0
          fi
          besedilo="Dnevna meritev preverjanja (scripts/meri-preverjanje.mjs --strogo) ni uspela: $IZID. Možni vzroki: napačno potrjena trditev, status nad upravičenim, izjema preverjevalnika ali motor ni tekel (SymPy). Poročilo je v povzetku zagona in v Artifacts: $ZAGON"
          if [ -n "$st" ]; then gh issue comment "$st" --body "$besedilo"; else gh issue create --title "$NASLOV" --body "$besedilo"; fi
          exit 1
