# Testi ob vsakem PR in vsaki združitvi v main (j 2026-11-06: »Da, nastavi«).
# Pet poslov za objavo: »testi« (npm test v 4 delih hkrati), »preveri« (v 3 delih hkrati) (scripts/preveri-aplikacijo.cjs, klik skozi
# vso aplikacijo na računalniku in telefonu), »hrosci« (scripts/najdi-hrosce.mjs, brez strežnika), »tipi« (TypeScript mobilne aplikacije)
# in »lekcije« (scripts/check-lesson.js --strogo, samo ob spremembi lekcij ali preverjevalnika). Vsi v preizkusnem načinu (EVKLID_MOCK=1): brez pravih
# ključev, brez klicev AI, Stripe ali e-pošte, brez .env. Ob napaki se naložijo dnevniki in posnetki
# (Actions > zagon > Artifacts). Agenti berejo izid z
#   gh api repos/jakobskerbis/evklid/commits/<sha>/check-runs
# Brskalniški del regresijske matrike urejevalnika (test/urejevalnik-matrika.test.js) tu ne teče (v CI se ne prijavi):
# poln teče vsako noč v matrika-nocna.yml. Čiste funkcije matrike in mala brskalniška testa (dotik-znaki, brisanje-predlog) tečejo tu.
# Repozitorij je javen: brez skrivnosti, samo pravica branja, nikoli pull_request_target,
# akcije pripete na SHA (komentar = različica).
name: Testi
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# PR: nov push prekliče star zagon istega PR. main (j 2026-11-24: »star testni zagon se ustavi, ko pride nov«):
# nov commit v main prekliče star zagon na main – objava (render-objava.js, ota.yml) potrebuje le izid zadnjega commita.
concurrency:
  group: testi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Izrecno bash: GitHub ga potem zažene z »-eo pipefail«, zato napaka pred »| tee« podre korak.
defaults:
  run:
    shell: bash
env:
  EVKLID_MOCK: "1"
  ANTHROPIC_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  RESEND_API_KEY: ""
  # Ista različica kot lokalno (scripts/preveri-aplikacijo.cjs in testi jo naložijo z require("playwright")).
  PLAYWRIGHT_VERSION: "1.63.0"
  # Zatikajoč se test pade po 10 min z imenom (velja za datoteko in za test; lastni »timeout« testa velja samo znotraj te meje; najdaljša datoteka zdaj ~2,3 min),
  # --test-force-exit pa konča proces, ki ga odprt brskalnik sicer drži živega.
  TEST_ZASTAVICE: "--test-timeout=600000 --test-force-exit"
jobs:
  # npm test v štirih delih hkrati (--test-shard, razdelitev po datotekah; j 21. 11. 2026: »hitrejše testiranje«):
  # ~12–17 min zaporedno → ~5 min (več delov ni hitreje: priprava ~1 min na del, najdaljša datoteka ~2,3 min, preveri ~6 min; 20 hkratnih poslov je meja računa). Vsak del ima svojo ponovitev nestabilnih in svoj dnevnik. Posel »testi«
  # spodaj združi izid delov pod starim imenom (render-objava.js, ota.yml in agenti berejo »testi«).
  testi-del:
    name: testi (${{ matrix.del }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        del: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Playwright (Chromium in WebKit za test iPada)
        timeout-minutes: 5
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit
      # Sistemski paketi za brskalnike (.deb) iz prejšnjih zagonov: Azurjevo ogledalo Ubuntuja jih občasno pošilja
      # s ~30–60 KB/s (paketi za WebKit, ~100 datotek; 7. 11. 2026 en 9 MB paket 3 min), zato se je namestitev
      # zatikala po 13 min × 3. apt vzame paket iz te mape, če se ujemata ime datoteke (paket_različica_arh) in velikost
      # (kontrolno vsoto preveri šele ob namestitvi), in prenese samo nove različice. Ključ po mesecu: enkrat na mesec
      # nov zapis (obnovljen iz prejšnjega); da mapa ne raste, apt-get autoclean po namestitvi odstrani stare različice.
      - id: mesec
        timeout-minutes: 1
        run: |
          echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "img=${ImageOS:-ubuntu}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/apt-arhiv
          key: apt-${{ runner.os }}-${{ steps.mesec.outputs.img }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit-${{ steps.mesec.outputs.m }}
          restore-keys: apt-${{ runner.os }}-${{ steps.mesec.outputs.img }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit-
      # Namestitev z omejitvijo časa in 3 poskusi: apt (sistemske knjižnice za brskalnike) se je že zataknil
      # sredi prenosa z ogledala in požrl 40 min; uspešne, a počasne namestitve pa trajajo do ~12 min, zato 13 min na poskus.
      # Brskalniki so v predpomnilniku, apt ostane vedno.
      - name: Namestitev brskalnikov (omejitev časa + ponovitev)
        timeout-minutes: 42
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci >/dev/null <<'APT'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Dir::Cache::Archives "/home/runner/apt-arhiv/";
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          APT
          # apt prenaša kot uporabnik _apt v podmapo partial; brez lastništva opozori »unsandboxed as root« in prenaša kot root.
          sudo mkdir -p ~/apt-arhiv/partial
          sudo chown _apt:root ~/apt-arhiv/partial
          echo "Paketov v predpomnilniku: $(find ~/apt-arhiv -maxdepth 1 -name '*.deb' | wc -l)"
          for poskus in 1 2 3; do
            if timeout -k 10 13m npx playwright install --with-deps chromium webkit; then
              # actions/cache shrani mapo kot uporabnik runner: brez zaklepa in mape partial (_apt, 0700).
              sudo timeout 2m apt-get autoclean -q || true # stare različice iz mape: predpomnilnik ne raste iz meseca v mesec
              sudo rm -rf ~/apt-arhiv/partial ~/apt-arhiv/lock; sudo chmod -R a+rX ~/apt-arhiv
              exit 0
            fi
            echo "::warning::Namestitev brskalnikov: poskus $poskus ni uspel ali je potekel (13 min)"
            # timeout ubije npx, apt pa teče naprej in drži zaklep: ubij ga, prenesene pakete obdrži (naslednji poskus nadaljuje).
            sudo pkill -9 -f '[a]pt-get|[a]pt |[d]pkg' || true
            sleep 2
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock ~/apt-arhiv/lock
            sudo DEBIAN_FRONTEND=noninteractive timeout 3m dpkg --configure -a --force-confdef --force-confold || true
            sudo DEBIAN_FRONTEND=noninteractive timeout 3m apt-get -f install -y || true
            sleep 5
          done
          echo "::error::Namestitev brskalnikov ni uspela v 3 poskusih"
          exit 1
      # Nestabilni testi: največ 1 ponovitev, samo za datoteke, ki so padle (največ 2 v delu, prej 3 v celem npm test). Ponovitev je vidna:
      # opozorilo (annotations_count > 0 v check-runs), vrstica v povzetku zagona, izhod ponovljeno=true in
      # naložen dnevnik. Več padlih datotek = prava napaka, brez ponovitve.
      # Ukaz mora ustrezati package.json scripts.test (+ $TEST_ZASTAVICE in --test-shard).
      - name: Testi (kot npm test)
        id: npmtest
        timeout-minutes: 30
        run: |
          set +e
          node --disable-warning=ExperimentalWarning --test $TEST_ZASTAVICE --test-shard=${{ matrix.del }}/4 test/*.test.js 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # »not ok … # TODO« ni napaka (node:test ga izpiše, a ne šteje): brez tega je bila datoteka lažno »nestabilna«
            files=$(grep -v -E '^\s*not ok .*# TODO' test.log | grep -A8 -E '^\s*not ok' | sed -n -E "s#.*location: '.*/(test/[^/:']+\.test\.js):.*#\1#p" | sort -u)
            n=$(printf '%s' "$files" | grep -c . || true)
            if [ "$n" -ge 1 ] && [ "$n" -le 2 ]; then
              echo "::warning::Ponovitev (1x) padlih testov: $(echo $files)"
              echo "ponovljeno=true" >> "$GITHUB_OUTPUT"
              echo "**Nestabilno – ponovljeno 1x:** $(echo $files). Dnevnik: artefakt testi-dnevnik-${{ matrix.del }}." >> "$GITHUB_STEP_SUMMARY"
              node --disable-warning=ExperimentalWarning --test $TEST_ZASTAVICE $files 2>&1 | tee -a test.log
              status=${PIPESTATUS[0]}
            fi
          fi
          exit "$status"
      - if: failure() || steps.npmtest.outputs.ponovljeno == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: testi-dnevnik-${{ matrix.del }}
          path: test.log
          retention-days: 7

  # Zelen samo, če so vsi štirje deli uspeli (tudi preklican ali preskočen del = napaka).
  testi:
    needs: testi-del
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vsi deli npm test
        env:
          IZID: ${{ needs.testi-del.result }}
        run: |
          echo "Deli npm test: $IZID"
          [ "$IZID" = "success" ]

  # Klik skozi aplikacijo v treh delih hkrati (računalnik, telefon, računi; ~6 min zaporedno). Posel »preveri«
  # spodaj združi izid pod starim imenom.
  preveri-del:
    name: preveri (${{ matrix.del }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        del: [racunalnik, telefon, racuni]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Playwright (Chromium)
        timeout-minutes: 5
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      # Sistemski paketi za brskalnike (.deb) iz prejšnjih zagonov: Azurjevo ogledalo Ubuntuja jih občasno pošilja
      # s ~30–60 KB/s (paketi za WebKit, ~100 datotek; 7. 11. 2026 en 9 MB paket 3 min), zato se je namestitev
      # zatikala po 13 min × 3. apt vzame paket iz te mape, če se ujemata ime datoteke (paket_različica_arh) in velikost
      # (kontrolno vsoto preveri šele ob namestitvi), in prenese samo nove različice. Ključ po mesecu: enkrat na mesec
      # nov zapis (obnovljen iz prejšnjega); da mapa ne raste, apt-get autoclean po namestitvi odstrani stare različice.
      - id: mesec
        timeout-minutes: 1
        run: |
          echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "img=${ImageOS:-ubuntu}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/apt-arhiv
          key: apt-${{ runner.os }}-${{ steps.mesec.outputs.img }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ steps.mesec.outputs.m }}
          restore-keys: apt-${{ runner.os }}-${{ steps.mesec.outputs.img }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      # Namestitev z omejitvijo časa in 3 poskusi: apt (sistemske knjižnice za brskalnike) se je že zataknil
      # sredi prenosa z ogledala in požrl 40 min; uspešne, a počasne namestitve pa trajajo do ~12 min, zato 13 min na poskus.
      # Brskalniki so v predpomnilniku, apt ostane vedno.
      - name: Namestitev brskalnikov (omejitev časa + ponovitev)
        timeout-minutes: 42
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci >/dev/null <<'APT'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Dir::Cache::Archives "/home/runner/apt-arhiv/";
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          APT
          # apt prenaša kot uporabnik _apt v podmapo partial; brez lastništva opozori »unsandboxed as root« in prenaša kot root.
          sudo mkdir -p ~/apt-arhiv/partial
          sudo chown _apt:root ~/apt-arhiv/partial
          echo "Paketov v predpomnilniku: $(find ~/apt-arhiv -maxdepth 1 -name '*.deb' | wc -l)"
          for poskus in 1 2 3; do
            if timeout -k 10 13m npx playwright install --with-deps chromium; then
              sudo timeout 2m apt-get autoclean -q || true # stare različice iz mape: predpomnilnik ne raste iz meseca v mesec
              sudo rm -rf ~/apt-arhiv/partial ~/apt-arhiv/lock; sudo chmod -R a+rX ~/apt-arhiv
              exit 0
            fi
            echo "::warning::Namestitev brskalnikov: poskus $poskus ni uspel ali je potekel (13 min)"
            # timeout ubije npx, apt pa teče naprej in drži zaklep: ubij ga, prenesene pakete obdrži (naslednji poskus nadaljuje).
            sudo pkill -9 -f '[a]pt-get|[a]pt |[d]pkg' || true
            sleep 2
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock ~/apt-arhiv/lock
            sudo DEBIAN_FRONTEND=noninteractive timeout 3m dpkg --configure -a --force-confdef --force-confold || true
            sudo DEBIAN_FRONTEND=noninteractive timeout 3m apt-get -f install -y || true
            sleep 5
          done
          echo "::error::Namestitev brskalnikov ni uspela v 3 poskusih"
          exit 1
      - name: Preveri aplikacijo
        timeout-minutes: 25
        run: node scripts/preveri-aplikacijo.cjs --samo ${{ matrix.del }} --posnetki posnetki 2>&1 | tee preveri.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: preveri-posnetki-${{ matrix.del }}
          path: |
            preveri.log
            posnetki/
          retention-days: 7
          if-no-files-found: ignore

  preveri:
    needs: preveri-del
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vsi deli preverjanja aplikacije
        env:
          IZID: ${{ needs.preveri-del.result }}
        run: |
          echo "Deli preveri: $IZID"
          [ "$IZID" = "success" ]

  # Tretji posel (j 2026-11-15): iskalnik hroščev brez AI, scripts/najdi-hrosce.mjs. Podvojeni ključi v kodi
  # in prevodih (velja samo zadnji, prvi tiho izgine). ~1 min; najdbe so izpisane v dnevniku posla.
  hrosci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
        timeout-minutes: 5
      - name: Najdi hrošče
        timeout-minutes: 3
        run: node scripts/najdi-hrosce.mjs

  # Četrti posel (j 2026-11-20): preverjanje tipov mobilne aplikacije (TypeScript, tudi skupne datoteke iz public/
  # in server/practice/, ki jih aplikacija uvozi), ~1 min. Brez namestitvenih skript (--ignore-scripts).
  # Render in posodobitev telefonov (ota.yml) čakata na vseh pet poslov.
  tipi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit --no-fund --ignore-scripts
        timeout-minutes: 5
      - name: Tipi (mobile, tsc --noEmit)
        timeout-minutes: 5
        run: npm --prefix mobile run typecheck

  # Peti posel (#7): vse lekcije skozi scripts/check-lesson.js -q --strogo (oblika, LaTeX, vsak številski korak in vsaka
  # trditev <<RACUN s SymPy; brez SymPy pade, ne le opozori). Učitelji lahko lekcije urejajo neposredno, zato ne zadošča
  # ročni zagon iz docs/pregled.md. Preverja samo, ko PR ali push spremeni lekcije ali preverjevalnik (~2 min, ves korpus);
  # sicer uspe v ~15 s, da je posel vedno prisoten (objava ga bere). Ves korpus tudi vsako noč (matrika-nocna.yml).
  lekcije:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: 2
      # PR: GitHub preveri združitveni commit, njegov prvi starš je vrh osnovne veje. Push: od prejšnjega vrha (event.before).
      # Če razlike ni mogoče izračunati (nova veja, prisilni push), preveri vse.
      - name: Ali so se spremenile lekcije ali preverjevalnik
        id: spremembe
        timeout-minutes: 3
        env:
          DOGODEK: ${{ github.event_name }}
          PREJ: ${{ github.event.before }}
        run: |
          if [ "$DOGODEK" = "pull_request" ]; then osnova=HEAD^1; else osnova="$PREJ"; fi
          if [ "$DOGODEK" != "pull_request" ] && ! git cat-file -e "$osnova^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$osnova" 2>/dev/null || osnova=""
          fi
          if [ -z "$osnova" ] || ! datoteke=$(git diff --name-only "$osnova" HEAD); then
            echo "Razlike ni mogoče izračunati: preverim vse lekcije."; echo "da=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          vzorec='^(content/lessons/|scripts/(check-lesson\.js|namesti-sympy\.cjs)$|server/(lesson-check|lesson-math|lesson-identity|racun|cas|textbook)\.js$|server/cas/|\.github/workflows/testi\.yml$)'
          zadetki=$(printf '%s\n' "$datoteke" | grep -E "$vzorec" || true)
          if [ -n "$zadetki" ]; then
            echo "Spremenjeno ($(printf '%s\n' "$zadetki" | wc -l) datotek), npr.:"; printf '%s\n' "$zadetki" | head -5
            echo "da=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lekcije in preverjevalnik niso spremenjeni: preverjanje preskočeno."
            echo "da=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.spremembe.outputs.da == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      # npm ci namesti tudi SymPy (postinstall: scripts/namesti-sympy.cjs v .pylib), a ob napaki pip ne pade; tu še 2 poskusa.
      - name: npm ci in SymPy
        if: steps.spremembe.outputs.da == 'true'
        timeout-minutes: 10
        run: |
          npm ci --no-audit --no-fund
          for poskus in 1 2; do
            PYTHONPATH=.pylib python3 -c "import sympy" 2>/dev/null && exit 0
            echo "::warning::SymPy ni nameščen, poskus $poskus"; sleep 15; node scripts/namesti-sympy.cjs
          done
      - name: Vse lekcije (check-lesson --strogo)
        if: steps.spremembe.outputs.da == 'true'
        timeout-minutes: 10
        run: node scripts/check-lesson.js -q --strogo
