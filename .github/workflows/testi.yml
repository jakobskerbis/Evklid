# Testi ob vsakem PR in vsaki združitvi v main (j 2026-11-06: »Da, nastavi«).
# Dva vzporedna posla: »testi« (npm test) in »preveri« (scripts/preveri-aplikacijo.cjs, klik skozi
# vso aplikacijo na računalniku in telefonu). Oba v preizkusnem načinu (EVKLID_MOCK=1): brez pravih
# ključev, brez klicev AI, Stripe ali e-pošte, brez .env. Ob napaki se naložijo dnevniki in posnetki
# (Actions > zagon > Artifacts). Agenti berejo izid z
#   gh api repos/jakobskerbis/evklid/commits/<sha>/check-runs
# Repozitorij je javen: brez skrivnosti, samo pravica branja, nikoli pull_request_target,
# akcije pripete na SHA (komentar = različica).
name: Testi
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# PR: nov push prekliče star zagon istega PR. main: vsak commit dobi svoj izid (brez preklica).
concurrency:
  group: testi-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Izrecno bash: GitHub ga potem zažene z »-eo pipefail«, zato napaka pred »| tee« podre korak.
defaults:
  run:
    shell: bash
env:
  EVKLID_MOCK: "1"
  ANTHROPIC_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  RESEND_API_KEY: ""
  # Ista različica kot lokalno (scripts/preveri-aplikacijo.cjs in testi jo naložijo z require("playwright")).
  PLAYWRIGHT_VERSION: "1.63.0"
jobs:
  testi:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright (Chromium in WebKit za test iPada)
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
      # Nestabilni testi: največ 1 ponovitev, samo za datoteke, ki so padle (največ 3). Ponovitev je vidna:
      # opozorilo (annotations_count > 0 v check-runs), vrstica v povzetku zagona, izhod ponovljeno=true in
      # naložen dnevnik. Več padlih datotek = prava napaka, brez ponovitve.
      - name: npm test
        id: npmtest
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            files=$(grep -A8 -E '^\s*not ok' test.log | sed -n -E "s#.*location: '.*/(test/[^/:']+\.test\.js):.*#\1#p" | sort -u)
            n=$(printf '%s' "$files" | grep -c . || true)
            if [ "$n" -ge 1 ] && [ "$n" -le 3 ]; then
              echo "::warning::Ponovitev (1x) padlih testov: $(echo $files)"
              echo "ponovljeno=true" >> "$GITHUB_OUTPUT"
              echo "**Nestabilno – ponovljeno 1x:** $(echo $files). Dnevnik: artefakt testi-dnevnik." >> "$GITHUB_STEP_SUMMARY"
              node --disable-warning=ExperimentalWarning --test $files 2>&1 | tee -a test.log
              status=${PIPESTATUS[0]}
            fi
          fi
          exit "$status"
      - if: failure() || steps.npmtest.outputs.ponovljeno == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testi-dnevnik
          path: test.log
          retention-days: 7

  preveri:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright (Chromium)
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - run: npx playwright install --with-deps chromium
      - name: Preveri aplikacijo
        run: node scripts/preveri-aplikacijo.cjs --posnetki posnetki 2>&1 | tee preveri.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preveri-posnetki
          path: |
            preveri.log
            posnetki/
          retention-days: 7
          if-no-files-found: ignore
