# Render: nova različica Evklida samo ponoči (3.–5. ura po ljubljanskem času), ko se nihče ne uči
# (ponovni zagon s trajnim diskom pomeni ~1 minuto izpada; j, 19. 11. 2026). Tek ob združitvi v main
# počaka na nočno okno, če je to v naslednjih ~3 urah, sicer konča; nočna urnika (0:47 in 1:47 UTC, tj.
# 1:47/2:47 pozimi, 2:47/3:47 poleti) in urnik vsako uro (rezerva) objavo opravijo v oknu.
# Pravila v scripts/render-objava.js: v oknu miren strežnik → takoj, zadnjih 30 min okna v vsakem primeru;
# [nujno] na začetku naslova ali ročni zagon → takoj; med objavama vsaj 1 ura.
# Nikoli pred zelenimi testi (j, 20. 11. 2026): objavi se samo commit, za katerega so vsi posli testi.yml
# (testi, preveri, hrosci, tipi) uspeli. Ko se Testi za main končajo (workflow_run), se tek zažene znova,
# zato [nujno] pride na Render nekaj minut po zelenih testih. Padli testi: ta commit se ne objavi.
# Deluje, ko je v GitHubu nastavljena skrivnost RENDER_DEPLOY_HOOK (Render > evklid > Settings > Deploy Hook).
# Ročni zagon (Actions > Render > Run workflow) objavi takoj, ko so testi zeleni; »brez_testov« (privzeto izklopljeno)
# objavi tudi brez njih (samo v sili). Navodila: docs/posodobitve.md
name: Render
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Testi]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
    - cron: "47 0,1 * * *"
  workflow_dispatch:
    inputs:
      brez_testov:
        description: "Objavi tudi brez zelenih testov (samo v sili)"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read # stanje testov (testi.yml) za commit
jobs:
  objavi:
    # Konec Testov za PR ne sproži ničesar (preskočen posel tudi ne prekine čakajočega teka: concurrency je na poslu).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    concurrency:
      group: render-objava
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/render-objava.js
            server/brand.js
            brand.json
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Zadnja sprožena objava (da neuspele objave ne ponavlja ob vsakem teku).
      - uses: actions/cache/restore@v6
        with:
          path: .render-objava.json
          key: render-objava-${{ github.run_id }}
          restore-keys: render-objava-
      - name: Objavi, če je čas
        id: objava
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROCNO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          BREZ_TESTOV: ${{ github.event_name == 'workflow_dispatch' && inputs.brez_testov && '1' || '0' }}
          # Tudi urnik čaka: novi tek (cancel-in-progress) prekine čakajočega, zato mora čakati naprej sam.
          CAKAJ: ${{ github.event_name != 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/render-objava.js
      - uses: actions/cache/save@v6
        # always(): shrani tudi, če novejši tek prekliče ta tek takoj po sprožitvi.
        if: always() && steps.objava.outputs.sprozeno == '1'
        with:
          path: .render-objava.json
          key: render-objava-${{ github.run_id }}
