# Ali Lean dokazi lekcij (lean/Evklid/Lekcije) še veljajo za trenutno besedilo lekcij (docs/lean.md, L2).
# Hitro, brez Leana: primerja sha256 v glavi dokaza z lekcijo, preveri id in citat vsake trditve, primere
# izpolnljivosti predpostavk in kazalo lean/trditve.json (PV-09). Ni med testi za objavo: spremenjena lekcija
# ne zadrži objave na evklid.app, le opozori, da je treba dokaz pregledati.
name: lean-lekcije

on:
  pull_request:
    paths: ["content/lessons/**", "lean/Evklid/Lekcije/**", "scripts/lean-lekcije.mjs", "scripts/lean-aksiomi.mjs", ".github/workflows/lean-lekcije.yml", "lean/trditve.json", "lean/izpolnljivo-dolg.json", "lean/oznake-dolg.json", "test/lean-lekcije.test.js"]
  push:
    branches: [main]
    paths: ["content/lessons/**", "lean/Evklid/Lekcije/**", "scripts/lean-lekcije.mjs", "scripts/lean-aksiomi.mjs", ".github/workflows/lean-lekcije.yml", "lean/trditve.json", "lean/izpolnljivo-dolg.json", "lean/oznake-dolg.json", "test/lean-lekcije.test.js"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lekcije:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/lean-lekcije.mjs
      - name: Seznama dolga (lean/izpolnljivo-dolg.json, lean/oznake-dolg.json) se smeta le krčiti
        if: github.event_name != 'workflow_dispatch'
        env:
          DOGODEK: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PREJ: ${{ github.event.before }}
        run: |
          # osnova: ciljna veja PR-ja ali stanje main pred tem pushem
          if [ "$DOGODEK" = pull_request ]; then git fetch --depth=1 origin "$BASE"; REF="origin/$BASE"; else git fetch --depth=1 origin "$PREJ"; REF="$PREJ"; fi
          git rev-parse --verify "$REF^{commit}" > /dev/null || { echo "::error::osnova $REF ni dosegljiva"; exit 1; }
          # seznam, ki ga osnova še nima, se uvede prvič (PV-09); če ga osnova ima, ga skripta primerja (manjkajoč v PR = napaka)
          args=()
          for par in izpolnljivo-dolg.json:--osnova-dolga oznake-dolg.json:--osnova-oznak; do
            f="${par%%:*}"; opt="${par##*:}"
            if git cat-file -e "$REF:lean/$f" 2>/dev/null; then git show "$REF:lean/$f" > "$RUNNER_TEMP/$f"; args+=("$opt" "$RUNNER_TEMP/$f"); fi
          done
          node scripts/lean-lekcije.mjs "${args[@]}"
      - run: node --test test/lean-lekcije.test.js
