# Ali Lean dokazi lekcij (lean/Evklid/Lekcije) še veljajo za trenutno besedilo lekcij (docs/lean.md, L2).
# Hitro, brez Leana: primerja sha256 v glavi dokaza z lekcijo, preveri id in citat vsake trditve, primere
# izpolnljivosti predpostavk in kazalo lean/trditve.json (PV-09). Ni med testi za objavo: spremenjena lekcija
# ne zadrži objave na evklid.app, le opozori, da je treba dokaz pregledati.
name: lean-lekcije

on:
  pull_request:
    paths: ["content/lessons/**", "lean/Evklid/Lekcije/**", "scripts/lean-lekcije.mjs", ".github/workflows/lean-lekcije.yml", "lean/trditve.json", "lean/izpolnljivo-dolg.json", "lean/oznake-dolg.json", "test/lean-lekcije.test.js"]
  push:
    branches: [main]
    paths: ["content/lessons/**", "lean/Evklid/Lekcije/**", "scripts/lean-lekcije.mjs", ".github/workflows/lean-lekcije.yml", "lean/trditve.json", "lean/izpolnljivo-dolg.json", "lean/oznake-dolg.json", "test/lean-lekcije.test.js"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lekcije:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/lean-lekcije.mjs
      - name: Seznama dolga (lean/izpolnljivo-dolg.json, lean/oznake-dolg.json) se smeta le krčiti
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          # seznam, ki ga osnovna veja še nima, se uvede prvič (PV-09) in ga ni s čim primerjati
          args=()
          if git show "origin/$BASE:lean/izpolnljivo-dolg.json" > "$RUNNER_TEMP/dolg.json" 2>/dev/null; then args+=(--osnova-dolga "$RUNNER_TEMP/dolg.json"); fi
          if git show "origin/$BASE:lean/oznake-dolg.json" > "$RUNNER_TEMP/oznake.json" 2>/dev/null; then args+=(--osnova-oznak "$RUNNER_TEMP/oznake.json"); fi
          node scripts/lean-lekcije.mjs "${args[@]}"
      - run: node --test test/lean-lekcije.test.js
