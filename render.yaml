# Render Blueprint: v Renderju izberi New > Blueprint in poveži ta repozitorij.
# Navodila: docs/objava.md
services:
  - type: web
    name: evklid
    runtime: node
    region: frankfurt          # najbližje Sloveniji
    plan: starter              # trajni disk ni na voljo v brezplačnem paketu
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false          # objava v mirnem trenutku: .github/workflows/render-posodobitev.yml
    disk:
      name: evklid-data
      mountPath: /var/data     # baza učencev ostane ob vsaki posodobitvi
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"                # node:sqlite brez zastavice šele od 22.13
      # Pomnilnik (17. 11. 2026, PR »Pomnilnik«): glibc sicer obdrži sproščen pomnilnik zlib/brotli, izrisa učbenika in
      # scrypt (RSS je rasel v stopnicah do ~400 MB in se ni vrnil). S temi tremi vrne velike kose sistemu: lokalno
      # (preizkusni način, enak promet) RSS strežnika po prometu 653 → 381 MB, v mirovanju po predgretju 384 → 240 MB.
      # Prebere jih glibc ob zagonu procesa, zato morajo biti tu (ne v kodi).
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: MALLOC_MMAP_THRESHOLD_
        value: "131072"
      # »Vaja iz testa ali domače naloge« (server/vaja-iz-lista.js): privzeto izklopljeno (j, 18. 11.); vklop po meritvi
      # natančnosti prepoznavanja znanja (≥ 90 %). Za vklop odstrani # v naslednjih dveh vrsticah.
      # - key: EVKLID_VAJA_IZ_TESTA
      #   value: "1"
      - key: EVKLID_DB
        value: /var/data/evklid.db
      # Slovenski glas za branje vprašanj na glas (ustno spraševanje): zasebna storitev evklid-glas spodaj
      # (server/govor.js govorMp3). Brez nje Evklid uporabi glas naprave (slovensko zna skoraj samo Edge).
      - key: EVKLID_GLAS_URL
        fromService:
          type: pserv
          name: evklid-glas
          property: hostport
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EVKLID_PASSWORD
        sync: false
      - key: EVKLID_DATA_KEY       # šifriranje pogovorov v bazi (docs/varnost-podatkov.md); kopija v upravitelju gesel!
        sync: false
      - key: EVKLID_ACCOUNTS
        value: "1"
      - key: EVKLID_BASE_URL
        sync: false
      - key: EVKLID_ADMIN_EMAILS
        sync: false
      # Namestnik, ki dobi e-mail ob oznaki stiske (server/stiska-obvestilo.js); neobvezno. EVKLID_STISKA_EMAIL=0 izklopi e-mail.
      - key: EVKLID_STISKA_EMAIL_NAMESTNIK
        sync: false
      # Člani pilota (docs/stroski-ai.md »Pilot in lastnik«): e-naslovi z vejicami, zadnji dan pilota.
      - key: EVKLID_PILOT_EMAILS
        sync: false
      - key: EVKLID_PILOT_DO
        value: "2026-12-15"
      # Ključ za tedenski izvoz kozmetike (GET /api/kozmetika/export, docs/kozmetika-posodobitve.md).
      - key: EVKLID_EXPORT_TOKEN
        generateValue: true
      - key: EVKLID_DAILY_QUESTIONS
        value: "0"
      - key: EVKLID_FREE_DAILY_QUESTIONS
        value: "10"
      - key: EVKLID_STUDENT_MONTHLY_USD
        value: "1.5"
      - key: EVKLID_MONTHLY_BUDGET_USD
        value: "200"
      # Pregled odgovora z zmogljivejšim modelom (server/live-check.js, docs/stroski-ai.md »Meje pregleda«): vsi učenci
      # skupaj na dan; šolski del (OŠ + SŠ) je polovica. j 18. 11.: med pilotom 3 $ (prej 1 $) in pregled tudi v OŠ.
      # Strošek gre v mejo učenca (marža ≥ 75 % ostane); dnevni bazen največ ~90 $ na mesec.
      - key: EVKLID_LIVE_CHECK_DAILY_USD
        value: "3"
      - key: EVKLID_LIVE_REVIEW_OS
        value: "1"
      # Ciljna meritev natančnosti po objavi teče v GitHubu (.github/workflows/meritev-po-objavi.yml), ne na strežniku:
      # strežnik in meritev skupaj presežeta 512 MB (16. 11. 2026). Strežnik spremenljivke EVKLID_MERITEV_PO_OBJAVI ne bere več.
      # Neaktivni računi (server/accounts/neaktivni.js, docs/izbris-izvoz.md): obvestilo po 12 mesecih, izbris po 24.
      # Privzeto izklopljeno; j vklopi po posvetu s pravnikom (odkomentiraj). Poročilo brez dejanj: /api/admin/neaktivni.
      # - key: EVKLID_NEAKTIVNI
      #   value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: EVKLID_KOPIJE_S3_URL
        sync: false
      - key: EVKLID_KOPIJE_S3_BUCKET
        sync: false
      - key: EVKLID_KOPIJE_S3_KEY_ID
        sync: false
      - key: EVKLID_KOPIJE_S3_SECRET
        sync: false

  # Glasovni strežnik (glas/streznik.py, j 19. 11. 2026 »Odprt glas na našem strežniku«): odprt glas spremeni besedilo
  # vprašanja v MP3. Zasebna storitev: dosegljiva samo iz strežnika evklid. Motor Supertonic 3 (OpenRAIL; j 20. 11.:
  # Piper je »preveč robotski«) porabi ~520 MB, zato plan standard (2 GB, 1 CPU, ≈ 25 $ na mesec). Za Piper (~220 MB,
  # starter ≈ 7 $) nastavi EVKLID_GLAS_MOTOR na piper in plan na starter.
  - type: pserv
    name: evklid-glas
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: pip install -r glas/requirements.txt && python glas/prenesi.py
    startCommand: python glas/streznik.py
    # Samo ob spremembi glas/ (glavni strežnik ima nočno okno; ta storitev nima podatkov, ob objavi do minute
    # bere glas naprave).
    autoDeploy: true
    buildFilter:
      paths:
        - glas/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: EVKLID_GLAS_MOTOR
        value: supertonic
      - key: EVKLID_GLAS_GLAS        # Supertonic: F1–F5 (ženski), M1–M5 (moški); izbral j
        value: F1
